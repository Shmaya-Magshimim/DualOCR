# Runs the same setup a user runs, on all three systems: installs Tesseract,
# downloads the models and llama.cpp, builds and installs the app, and checks
# the installed app. (Surya's 1.4 GB model isn't downloaded here.)
name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Tesseract (Windows runners have no winget)
        if: runner.os == 'Windows'
        run: choco install tesseract -y --no-progress

      - name: Setup (macOS, Linux)
        if: runner.os != 'Windows'
        run: |
          ./setup.sh --yes --skip-surya-model
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Setup (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          .\setup.cmd --yes --skip-surya-model
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "$env:USERPROFILE\.local\bin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH

      - name: Installed app works (macOS)
        if: runner.os == 'macOS'
        run: ~/Applications/DualOCR.app/Contents/MacOS/dualocr-cli --check

      - name: Installed app works (Linux)
        if: runner.os == 'Linux'
        run: |
          ~/.local/opt/DualOCR/dualocr-cli --check
          test -f ~/.local/share/applications/dualocr.desktop

      - name: Installed app works (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & "$env:LOCALAPPDATA\Programs\DualOCR\dualocr-cli.exe" --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\DualOCR.lnk")) { exit 1 }

      - name: Setup again from Windows PowerShell 5.1 (most PCs have no PowerShell 7)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          cmd /c "set PSModulePath= && powershell -NoProfile -ExecutionPolicy Bypass -File setup.ps1 --yes --skip-surya-model"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Unit tests
        run: uv run --locked --extra build --extra dev pytest -q tests/test_core.py

      - name: Window code loads
        env:
          QT_QPA_PLATFORM: offscreen
        run: uv run --locked --extra build python -c "import dualocr.ui.app, dualocr.ui.review; print('ok')"
